name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-tests:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 5m -json ./internal/... > go-tests.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: go-tests-${{ matrix.os }}
          path: go-tests.json
          if-no-files-found: error
          retention-days: 14
      - run: go vet ./internal/...
  frontend:
    name: React / Chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test --prefix frontend
  build:
    name: Build / ${{ matrix.target }}
    needs: [go-tests, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build Windows from Linux
        if: matrix.target == 'windows'
        run: |
          ./scripts/build-windows.sh
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          ./scripts/build-linux.sh
          go vet -tags webkit2_41 ./...
      - name: Package with attribution
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p package
          cp build/bin/NishiTerm* LICENSE NOTICE README.md package/
          (cd package && sha256sum NishiTerm* > SHA256SUMS)
          tar -czf "NishiTerm-${TARGET}-amd64.tar.gz" -C package .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NishiTerm-${{ matrix.target }}-amd64
          path: NishiTerm-${{ matrix.target }}-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish latest downloads
    needs: [go-tests, frontend, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download packages from this run
        run: |
          gh run download "$GITHUB_RUN_ID" --name NishiTerm-windows-amd64 --dir downloads/windows
          gh run download "$GITHUB_RUN_ID" --name NishiTerm-linux-amd64 --dir downloads/linux
      - name: Verify packages and prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          for target in windows linux; do
            archive="NishiTerm-${target}-amd64.tar.gz"
            mkdir -p "unpacked/$target"
            tar -xzf "downloads/$target/$archive" -C "unpacked/$target"
            (cd "unpacked/$target" && sha256sum --check SHA256SUMS)
            cp "downloads/$target/$archive" release/
          done
          test -s unpacked/windows/NishiTerm.exe
          test -x unpacked/linux/NishiTerm
          (cd unpacked/windows && zip ../../release/NishiTerm-windows-amd64.zip NishiTerm.exe LICENSE NOTICE README.md SHA256SUMS)
          (cd release && sha256sum NishiTerm-* > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Publish complete release as latest
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo 'Main avançou; esta execução não atualizará latest.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF
          Build de desenvolvimento para avaliação, sem assinatura digital. Não é uma certificação de estabilidade.

          - Windows x64: baixe NishiTerm-windows-amd64.zip, extraia e execute NishiTerm.exe como usuário comum. Requer WebView2 disponível; não instala runtime nem pede elevação.
          - Linux x64: baixe NishiTerm-linux-amd64.tar.gz e extraia. Requer GTK3 e WebKitGTK 4.1; compilado no Ubuntu 22.04.
          - SHA256SUMS verifica os pacotes; cada pacote também contém o checksum do binário, LICENSE e NOTICE.
          - Testes Go com race detector em Linux/Windows, testes Chromium e ambos os builds passaram. Testes de interface usam bridge simulado; validação da interface nativa atual no Windows continua pendente.

          Commit: $GITHUB_SHA
          Evidências: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          EOF
          # gh creates a draft, uploads all assets, then publishes it as latest.
          gh release create "$tag" release/* --target "$GITHUB_SHA" \
            --title "NishiTerm build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md --latest
          echo "Downloads: https://github.com/$GH_REPO/releases/latest" >> "$GITHUB_STEP_SUMMARY"
