name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-tests:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 5m ./internal/...
      - run: go vet ./internal/...
  frontend:
    name: React / Chromium
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test --prefix frontend
  build:
    name: Build / ${{ matrix.target }}
    needs: [go-tests, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build Windows from Linux
        if: matrix.target == 'windows'
        run: |
          ./scripts/build-windows.sh
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          ./scripts/build-linux.sh
          go vet -tags webkit2_41 ./...
      - name: Package with attribution
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p package
          cp build/bin/NishiTerm* LICENSE NOTICE README.md package/
          (cd package && sha256sum NishiTerm* > SHA256SUMS)
          tar -czf "NishiTerm-${TARGET}-amd64.tar.gz" -C package .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NishiTerm-${{ matrix.target }}-amd64
          path: NishiTerm-${{ matrix.target }}-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14
